services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_storage:/app/storage
    environment:
      SECRET_KEY: "change-me-in-production"
      BOOTSTRAP_ADMIN_PASSWORD: "admin12345"
      BOOTSTRAP_EXPERT_PASSWORD: "expert12345"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "http://localhost:8000"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_storage:
